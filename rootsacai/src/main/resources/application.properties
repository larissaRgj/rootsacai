# ========================================
# Configuração Spring Boot
# ========================================
spring.application.name=rootsacai
server.port=8080
server.servlet.context-path=/

# ========================================
# Banco de Dados - MySQL (Produção)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/rootsacai_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=seu_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.com.rootsacai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# ========================================
# JWT
# ========================================
jwt.secret=sua_chave_secreta_muito_longa_e_segura_com_pelo_menos_256_bits_para_HS256_algoritmo
jwt.expiration=86400000

# ========================================
# CORS
# ========================================
cors.allowed-origins=http://localhost:3000,http://localhost:8000,http://127.0.0.1:5500
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600
